version: '3.8'
services:
  api:
    build: .
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0

  agent-worker:
    build: .
    command: python src/worker.py
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LLM_API_BASE=http://stub-llm:8001

  stub-llm:
    build: .
    command: uvicorn src.stub_llm:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"